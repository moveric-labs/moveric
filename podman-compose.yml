services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: moveric
      POSTGRES_PASSWORD: moveric
      POSTGRES_DB: moveric_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  nats:
    image: nats:latest
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: moveric
      MINIO_ROOT_PASSWORD: moveric123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
volumes:
  postgres_data:
  nats_data:
  minio_data:
